<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>INIT.AI — Urban Heat Island Platform</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0705;--bg2:#180b08;--bg3:#1e100c;--bg4:#261510;
  --border:#3a1a12;--border2:#4d2418;
  --accent:#ff6b2b;--accent2:#e5521a;--accent3:rgba(255,107,43,0.13);
  --sun:#ffb347;--sun2:#ff8c00;
  --heat1:#ff3a1a;--heat2:#ff6b2b;--heat3:#ffb347;
  --cool:#00c9a7;
  --text:#fdf0e8;--text2:#c49a82;--text3:#7a5040;
  --blue:#4fa3e0;--purple:#c084fc;--green:#4ade80;--yellow:#ffd166;
  --fh:'Syne',sans-serif;--fb:'Outfit',sans-serif;--fm:'DM Mono',monospace;
  --r:8px;--r2:14px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);overflow:hidden}
#root{height:100%}

/* ─── AUTH ─────────────────────────────────────────────── */
.auth-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);position:relative;overflow:hidden}
.auth-bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(255,107,43,.15) 0%,transparent 70%)}
.auth-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:44px 44px;opacity:.5}
.auth-box{position:relative;width:430px;background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:42px;z-index:1}
.auth-logo-row{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.auth-logo-ico{width:44px;height:44px;background:var(--heat1);border-radius:10px;display:flex;align-items:center;justify-content:center}
.auth-logo-ico svg{width:24px;height:24px;fill:#fff}
.auth-logo-name{font-family:var(--fh);font-size:24px}
.auth-logo-name span{color:var(--accent)}
.auth-logo-tag{font-family:var(--fm);font-size:9px;color:var(--text3)}
.auth-title{font-family:var(--fh);font-size:26px;margin-bottom:6px}
.auth-sub{font-size:13px;color:var(--text2);margin-bottom:28px;line-height:1.55}
.auth-label{font-size:10px;font-family:var(--fm);color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;display:block}
.auth-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:11px 14px;color:var(--text);font-family:var(--fb);font-size:14px;outline:none;transition:border-color .2s;margin-bottom:16px}
.auth-input:focus{border-color:var(--accent)}
.auth-input::placeholder{color:var(--text3)}
.auth-select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:11px 14px;color:var(--text);font-family:var(--fb);font-size:14px;outline:none;margin-bottom:16px;cursor:pointer}
.auth-btn{width:100%;padding:13px;background:var(--heat1);border:none;border-radius:var(--r);color:#fff;font-family:var(--fh);font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s;letter-spacing:.03em}
.auth-btn:hover{opacity:.85}
.auth-switch{text-align:center;margin-top:20px;font-size:13px;color:var(--text2)}
.auth-switch a{color:var(--accent);cursor:pointer}
.auth-err{background:rgba(255,58,26,.12);border:1px solid rgba(255,58,26,.3);border-radius:var(--r);padding:10px 14px;font-size:13px;color:#ff7a5a;margin-bottom:16px;display:none}
.auth-err.show{display:block}
.demo-creds{margin-top:18px;padding:13px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);font-family:var(--fm);font-size:10px;color:var(--text3);line-height:1.9}
.demo-creds span{color:var(--accent)}

/* ─── APP SHELL ─────────────────────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden}

/* ─── SIDEBAR ───────────────────────────────────────────── */
.sidebar{width:222px;min-width:222px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .2s}
.sidebar-logo{padding:18px 18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-ico{width:34px;height:34px;background:var(--heat1);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-ico svg{width:18px;height:18px;fill:#fff}
.logo-name{font-family:var(--fh);font-size:18px}
.logo-name span{color:var(--accent)}
.logo-ver{font-family:var(--fm);font-size:9px;color:var(--text3);display:block;margin-top:1px}
.sidebar-nav{flex:1;padding:10px 8px;overflow-y:auto}
.sidebar-nav::-webkit-scrollbar{width:3px}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.nav-sec{font-family:var(--fm);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;padding:8px 12px 4px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r);cursor:pointer;transition:all .15s;color:var(--text2);font-size:13px;margin-bottom:1px;user-select:none;border:1px solid transparent}
.ni:hover{background:var(--bg3);color:var(--text)}
.ni.active{background:var(--accent3);color:var(--accent);border-color:rgba(255,107,43,.22)}
.ni svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor}
.nb{margin-left:auto;font-size:9px;padding:2px 6px;border-radius:10px;font-family:var(--fm);line-height:1.4}
.nb.r{background:var(--heat1);color:#fff}
.nb.o{background:var(--accent);color:#fff}
.nb.s{background:var(--sun2);color:#fff}
.nb.g{background:#15803d;color:#4ade80}
.nb.p{background:rgba(192,132,252,.2);color:#d8b4fe}
.sidebar-user{padding:12px 14px;border-top:1px solid var(--border)}
.user-card{display:flex;align-items:center;gap:10px}
.user-av{width:32px;height:32px;border-radius:50%;background:var(--accent3);border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--accent);font-family:var(--fm);flex-shrink:0}
.user-name{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:10px;font-family:var(--fm);color:var(--accent)}
.logout-btn{width:26px;height:26px;background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .2s;flex-shrink:0;margin-left:auto}
.logout-btn:hover{border-color:var(--heat1);color:var(--heat1)}
.logout-btn svg{width:12px;height:12px;stroke:currentColor}

/* ─── MAIN ──────────────────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:0 22px;height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg2);flex-shrink:0}
.topbar-title{font-family:var(--fh);font-size:15px;flex:1}
.topbar-sub{font-family:var(--fm);font-size:10px;color:var(--text3);margin-left:8px;font-weight:400}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.topbar-pill{font-family:var(--fm);font-size:10px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:4px 10px;color:var(--text2)}
.city-sel{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:5px 10px;color:var(--text);font-size:11px;font-family:var(--fm);cursor:pointer;outline:none}
.content{flex:1;overflow-y:auto;padding:16px 20px}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ─── LAYOUT HELPERS ────────────────────────────────────── */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.g21{display:grid;grid-template-columns:1.55fr 1fr;gap:12px;margin-bottom:14px}
.g12{display:grid;grid-template-columns:1fr 1.55fr;gap:12px;margin-bottom:14px}
.mb{margin-bottom:14px}

/* ─── CARDS ─────────────────────────────────────────────── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:16px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.card-title{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.badge{font-size:10px;font-family:var(--fm);background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:3px 8px;color:var(--text2)}

/* ─── STAT MINI ─────────────────────────────────────────── */
.sm{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.sm::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sm.s1::before{background:linear-gradient(90deg,var(--heat1),var(--heat2))}
.sm.s2::before{background:linear-gradient(90deg,var(--heat2),var(--sun))}
.sm.s3::before{background:linear-gradient(90deg,var(--green),#16a34a)}
.sm.s4::before{background:linear-gradient(90deg,var(--cool),var(--blue))}
.sm.s5::before{background:linear-gradient(90deg,var(--purple),var(--blue))}
.sm-label{font-size:9px;font-family:var(--fm);color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.sm-val{font-family:var(--fh);font-size:22px;line-height:1}
.sm-val span{font-size:13px;color:var(--text2);font-family:var(--fb);font-weight:400}
.sm-delta{font-size:10px;font-family:var(--fm);margin-top:5px}
.up{color:var(--heat2)}.dn{color:var(--green)}.neu{color:var(--text3)}

/* ─── CONTROLS ──────────────────────────────────────────── */
.ctrl{padding:5px 11px;border-radius:6px;font-size:11px;font-family:var(--fm);cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text2);transition:all .15s;user-select:none}
.ctrl.active{background:var(--accent3);color:var(--accent);border-color:rgba(255,107,43,.3)}
.ctrl:hover:not(.active){background:var(--bg4);color:var(--text)}
.act-btn{padding:4px 10px;border-radius:5px;font-size:10px;font-family:var(--fm);cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);transition:all .15s}
.act-btn:hover{border-color:var(--accent);color:var(--accent)}
.dl-btn{padding:5px 10px;border-radius:6px;font-size:10px;font-family:var(--fm);cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);transition:all .15s;flex-shrink:0}
.dl-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ─── MAP ────────────────────────────────────────────────── */
.map-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;position:relative}
.map-svg{width:100%;display:block}
.sat-badge{position:absolute;top:8px;right:8px;background:rgba(15,7,5,.88);border:1px solid var(--border2);border-radius:6px;font-family:var(--fm);font-size:9px;color:var(--text3);padding:5px 9px;line-height:1.6;pointer-events:none}
.map-legend{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:10px;font-family:var(--fm);color:var(--text3)}
.leg-bar{flex:1;height:5px;border-radius:3px}

/* ─── TABLE ──────────────────────────────────────────────── */
.hs-table{width:100%;border-collapse:collapse;font-size:12px}
.hs-table th{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);padding:0 8px 8px 0;text-align:left;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
.hs-table th:hover{color:var(--text2)}
.hs-table td{padding:9px 8px 9px 0;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle}
.hs-table tr:last-child td{border-bottom:none}
.hs-table tr:hover td{background:rgba(255,107,43,.03)}
.sev{display:inline-flex;padding:2px 7px;border-radius:4px;font-size:10px;font-family:var(--fm)}
.sev.critical{background:rgba(255,58,26,.15);color:#ff7a5a;border:1px solid rgba(255,58,26,.25)}
.sev.high{background:rgba(255,107,43,.15);color:#ffaa70;border:1px solid rgba(255,107,43,.25)}
.sev.moderate{background:rgba(255,179,71,.15);color:#ffd87a;border:1px solid rgba(255,179,71,.25)}
.sev.low{background:rgba(74,222,128,.15);color:#4ade80;border:1px solid rgba(74,222,128,.25)}
.spark{display:flex;gap:2px;align-items:flex-end;height:18px}
.sp-bar{width:5px;border-radius:1px}

/* ─── CANOPY ─────────────────────────────────────────────── */
.cd-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.cd{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px;cursor:pointer;transition:border-color .2s;user-select:none}
.cd:hover{border-color:var(--border2)}
.cd.sel{border-color:var(--accent);background:var(--accent3)}
.cd-name{font-size:10px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-pct{font-family:var(--fh);font-size:16px;margin-bottom:2px}
.cd-bar{height:3px;border-radius:2px;background:var(--border);overflow:hidden;margin-bottom:2px}
.cd-fill{height:100%;border-radius:2px}

/* ─── MITIGATION ─────────────────────────────────────────── */
.iv{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:12px;cursor:pointer;transition:all .15s;user-select:none;margin-bottom:8px}
.iv:hover{border-color:var(--border2)}
.iv.sel{border-color:var(--accent)}
.iv-hd{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.iv-ico{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iv-ico svg{width:15px;height:15px}
.iv-title{font-size:12.5px;font-weight:600;flex:1}
.iv-cool{font-family:var(--fh);font-size:17px;color:var(--green)}
.iv-meta{display:flex;gap:8px;font-size:11px;font-family:var(--fm);margin-bottom:7px;flex-wrap:wrap}
.prog-label{display:flex;justify-content:space-between;font-size:10px;font-family:var(--fm);color:var(--text3);margin-bottom:3px}
.prog-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .6s}

/* ─── ROI TABLE ──────────────────────────────────────────── */
.roi-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.roi-row:last-child{border-bottom:none}
.roi-label{color:var(--text3)}
.roi-val{font-family:var(--fm)}
.rv-g{color:var(--green)}.rv-w{color:var(--yellow)}.rv-r{color:var(--heat2)}

/* ─── ALERTS ─────────────────────────────────────────────── */
.alert-item{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:var(--r);margin-bottom:8px;border:1px solid}
.alert-item.crit{background:rgba(255,58,26,.08);border-color:rgba(255,58,26,.25)}
.alert-item.warn{background:rgba(255,179,71,.08);border-color:rgba(255,179,71,.25)}
.alert-item.info{background:rgba(79,163,224,.08);border-color:rgba(79,163,224,.25)}
.alert-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.alert-ico svg{width:16px;height:16px;stroke:currentColor}
.a-badge{font-size:10px;font-family:var(--fm);padding:2px 8px;border-radius:4px;margin-left:auto;flex-shrink:0;height:fit-content}
.ab-crit{background:rgba(255,58,26,.2);color:#ff7a5a}
.ab-warn{background:rgba(255,179,71,.2);color:#ffd166}
.ab-info{background:rgba(79,163,224,.2);color:#7ec8f5}

/* ─── REPORTS ────────────────────────────────────────────── */
.rep-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.rep-item:last-child{border-bottom:none}
.rep-ico{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rep-ico svg{width:16px;height:16px}

/* ─── TIMELINE ───────────────────────────────────────────── */
.tl-wrap{position:relative;padding-left:24px;margin-top:4px}
.tl-line{position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--border)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{position:absolute;left:-20px;top:4px;width:9px;height:9px;border-radius:50%}
.tl-dot.done{background:var(--green);border:2px solid var(--green)}
.tl-dot.active{background:var(--accent);border:2px solid var(--accent)}
.tl-dot.pending{background:var(--bg3);border:2px solid var(--border2)}

/* ─── AI CHAT ────────────────────────────────────────────── */
.ai-stream{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px;font-family:var(--fm);font-size:11px;color:var(--text2);line-height:1.7;min-height:110px}
.ai-cursor{display:inline-block;width:7px;height:13px;background:var(--accent);margin-left:3px;vertical-align:middle;animation:cur 1.1s steps(1) infinite}
@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}
.ai-tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;margin-right:4px;font-family:var(--fm)}
.ai-tag.hot{background:rgba(255,58,26,.15);color:#ff7a5a;border:1px solid rgba(255,58,26,.2)}
.ai-tag.warn{background:rgba(255,179,71,.15);color:#ffd166;border:1px solid rgba(255,179,71,.2)}
.ai-tag.ok{background:rgba(74,222,128,.15);color:#4ade80;border:1px solid rgba(74,222,128,.2)}
.ai-tag.info{background:rgba(79,163,224,.15);color:#7ec8f5;border:1px solid rgba(79,163,224,.2)}
.chat-msg{padding:10px 12px;border-radius:var(--r);margin-bottom:8px;font-size:12px;line-height:1.6}
.chat-msg.user{background:var(--accent3);border:1px solid rgba(255,107,43,.2);color:var(--text)}
.chat-msg.ai{background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
.chat-label{font-size:10px;font-family:var(--fm);margin-bottom:4px}
.chat-label.u{color:var(--accent)}.chat-label.a{color:var(--cool)}
.ai-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;color:var(--text);font-family:var(--fm);font-size:12px;outline:none}
.ai-input:focus{border-color:var(--accent)}
.ai-input::placeholder{color:var(--text3)}
.ai-send{padding:9px 16px;background:var(--heat1);border:none;border-radius:var(--r);color:#fff;font-family:var(--fh);font-size:12px;cursor:pointer;transition:opacity .2s}
.ai-send:hover{opacity:.85}

/* ─── SATELLITE ──────────────────────────────────────────── */
.sat-strip{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.sat-thumb{width:110px;height:82px;border-radius:var(--r);border:2px solid var(--border);cursor:pointer;flex-shrink:0;overflow:hidden;transition:border-color .2s;position:relative}
.sat-thumb.sel{border-color:var(--accent)}
.sat-thumb:hover{border-color:var(--border2)}
.sat-thumb svg{width:100%;height:100%}
.sat-lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(15,7,5,.85);font-family:var(--fm);font-size:8px;color:var(--text2);padding:3px 5px}

/* ─── CITY COMPARE ───────────────────────────────────────── */
.ct-tab{padding:7px 13px;border-radius:6px;font-size:12px;font-family:var(--fm);cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text3);transition:all .15s;user-select:none}
.ct-tab.active{background:var(--accent3);color:var(--accent);border-color:rgba(255,107,43,.3)}
.ct-tab:hover:not(.active){color:var(--text2);background:var(--bg4)}
.cmp-grid{display:grid;gap:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:6px}
.cmp-cell{padding:9px 12px;font-size:12px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.cmp-cell:last-child{border-right:none}
.cmp-cell.lbl{color:var(--text3);font-family:var(--fm);font-size:10px}
.cmp-cell.cn{font-family:var(--fh);font-size:12px;color:var(--accent)}
.cmp-bar-wrap{height:3px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden}

/* ─── EXPORT ─────────────────────────────────────────────── */
.exp-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}

.es-proc{background:rgba(255,107,43,.12);color:#ffaa70;border:1px solid rgba(255,107,43,.2)}
.es-sched{background:rgba(79,163,224,.12);color:#7ec8f5;border:1px solid rgba(79,163,224,.2)}

/* ─── USER MGMT ──────────────────────────────────────────── */
.u-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.u-row:last-child{border-bottom:none}
.u-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;font-family:var(--fm);flex-shrink:0}
.rb-admin{background:rgba(255,58,26,.15);color:#ff7a5a;border:1px solid rgba(255,58,26,.25)}
.rb-planner{background:rgba(255,107,43,.15);color:#ffaa70;border:1px solid rgba(255,107,43,.25)}
.rb-viewer{background:rgba(79,163,224,.15);color:#7ec8f5;border:1px solid rgba(79,163,224,.25)}

/* ─── SLIDER ─────────────────────────────────────────────── */
.rw{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rw label{font-size:11px;font-family:var(--fm);color:var(--text3);min-width:130px}
.rw input[type=range]{flex:1;accent-color:var(--accent)}
.rv{font-family:var(--fm);font-size:11px;color:var(--accent);min-width:50px;text-align:right}
.filter-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;color:var(--text);font-family:var(--fm);font-size:12px;outline:none}
.filter-input:focus{border-color:var(--accent)}
.filter-input::placeholder{color:var(--text3)}

/* ─── NOTIFICATIONS ──────────────────────────────────────── */
.notif{position:fixed;top:16px;right:16px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:12px 16px;font-family:var(--fm);font-size:11px;color:var(--text2);z-index:9999;animation:slideIn .3s ease;max-width:280px}
.notif.success{border-left:3px solid var(--green);color:var(--green)}

.notif.info{border-left:3px solid var(--blue);color:#7ec8f5}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── Notification ── */
function notify(msg,type='info'){
  const el=document.createElement('div');
  el.className=`notif ${type}`;
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3200);
}

/* ── Chart registry (destroy before recreate) ── */
const chartRegistry={};
function makeChart(id,config){
  if(chartRegistry[id]){try{chartRegistry[id].destroy();}catch(e){}}
  const el=document.getElementById(id);
  if(!el)return;
  chartRegistry[id]=new Chart(el,config);
}
const C={font:'DM Mono',grid:'#3a1a12',tick:'#7a5040'};

}
function bindAuth(){
  document.getElementById('sw').onclick=()=>{S.authMode=S.authMode==='login'?'register':'login';render();};
  document.getElementById('auth-submit').onclick=doAuth;
  document.getElementById('auth-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();});
}
function showErr(msg){const el=document.getElementById('auth-err');if(el){el.textContent=msg;el.classList.add('show');}}
function doAuth(){
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  if(!email||!pass){showErr('Please fill in all fields.');return;}
  const users=getUsers();
  if(S.authMode==='login'){
    const u=users.find(u=>u.email===email&&u.password===pass);
    if(!u){showErr('Invalid email or password.');return;}
    saveSess({token:mkJWT(u),user:u});S.user=u;S.view='app';render();
  } else {
    const name=document.getElementById('reg-name').value.trim();
    const role=document.getElementById('reg-role').value;
    if(!name){showErr('Enter your full name.');return;}
    if(users.find(u=>u.email===email)){showErr('Email already registered.');return;}
    const nu={email,password:pass,name,role};
    users.push(nu);saveUsers(users);
    saveSess({token:mkJWT(nu),user:nu});S.user=nu;S.view='app';render();
  }
}

function ndviBlocks(district){
  const cells=[];
  const ndviColors=['#b71c1c','#d32f2f','#ff6b2b','#ffd166','#a5c442','#4caf50','#2e7d32','#1b5e20'];
  const base=district.canopy/100;
  for(let r=0;r<10;r++)for(let c=0;c<15;c++){
    const v=Math.max(0,Math.min(1,base+Math.sin(r*7.3+c*3.1)*0.3+Math.cos(r*2.1+c*5.7)*0.2));
    cells.push(`<rect x="${10+c*18}" y="${18+r*18}" width="17" height="17" rx="1" fill="${ndviColors[Math.floor(v*7)]}" opacity="${(0.55+v*0.45).toFixed(2)}"/>`);
  }
  return cells.join('');
}

/* ══════════════════════════════════════════════
   HOTSPOTS
══════════════════════════════════════════════ */
function renderHotspots(){
  const fil=HOTSPOTS.filter(h=>[h.id,h.loc,h.sev,h.cause].join(' ').toLowerCase().includes(S.hsFilter||''));
  const sorted=[...fil].sort((a,b)=>S.hsSort==='temp'?S.hsSortDir*(b.temp-a.temp):S.hsSort==='ndvi'?S.hsSortDir*(b.ndvi-a.ndvi):S.hsSortDir*(a.id.localeCompare(b.id)));
  const sc={critical:0,high:0,moderate:0,low:0};
  HOTSPOTS.forEach(h=>sc[h.sev]++);
  return `
  <div class="g4">
    <div class="sm s1"><div class="sm-label">Total Hotspots</div><div class="sm-val">${HOTSPOTS.length} <span>zones</span></div><div class="sm-delta up">▲ +3 this week</div></div>
    <div class="sm s1"><div class="sm-label">Critical Zones</div><div class="sm-val" style="color:var(--heat1)">${sc.critical} <span>zones</span></div><div class="sm-delta up">▲ Immediate action</div></div>
    <div class="sm s2"><div class="sm-label">Max Recorded</div><div class="sm-val">41.2 <span>°C</span></div><div class="sm-delta up">▲ Kamuning Rd</div></div>
    <div class="sm s4"><div class="sm-label">Avg NDVI</div><div class="sm-val">0.19 <span>index</span></div><div class="sm-delta dn">▼ Low vegetation</div></div>
  </div>
  <div class="g2 mb">
    <div class="card">
      <div class="card-hd"><div class="card-title"><span class="dot" style="background:var(--heat1)"></span>Severity Distribution</div></div>
      <div style="display:flex;gap:14px;align-items:center">
        <div style="position:relative;height:140px;width:140px;flex-shrink:0"><canvas id="sevChart" role="img" aria-label="Hotspot severity donut chart">Critical 2, High 2, Moderate 3, Low 5.</canvas></div>
        <div style="font-family:var(--fm);font-size:11px;display:flex;flex-direction:column;gap:8px">
          ${[['Critical',sc.critical,'#ff3a1a'],['High',sc.high,'#ff6b2b'],['Moderate',sc.moderate,'#ffd166'],['Low',sc.low,'#4ade80']].map(([l,v,c])=>`<div style="display:flex;align-items:center;gap:7px"><span style="width:10px;height:10px;background:${c};border-radius:2px;display:inline-block"></span><span style="color:var(--text2)">${l}</span><span style="color:var(--text3);margin-left:auto">${v}</span></div>`).join('')}
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-hd"><div class="card-title"><span class="dot" style="background:var(--blue)"></span>Temp vs NDVI Correlation</div><div class="badge">SCATTER</div></div>
      <div style="position:relative;height:155px"><canvas id="scatterChart" role="img" aria-label="Scatter plot of surface temperature versus NDVI index">Strong negative correlation between vegetation and temperature.</canvas></div>
    </div>
  </div>
  <div class="card">
    <div class="card-hd">
      <div class="card-title"><span class="dot" style="background:var(--heat2)"></span>Hotspot Registry</div>
      <div style="display:flex;gap:6px;align-items:center"><div class="badge">${fil.length}/${HOTSPOTS.length} ZONES</div><div class="ctrl" onclick="notify('Exporting CSV...','info')">⬇ EXPORT CSV</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap">
      <input class="filter-input" id="hs-search" placeholder="Search by ID, location, severity, cause…" value="${S.hsFilter||''}"/>
      ${['temp','ndvi'].map(s=>`<div class="ctrl${S.hsSort===s?' active':''}" data-sort="${s}">SORT: ${s.toUpperCase()}</div>`).join('')}
    </div>
    <div style="overflow-x:auto">
    <table class="hs-table">
      <thead><tr><th>ID</th><th>Location</th><th>Coordinates</th><th>Temp</th><th>Severity</th><th>NDVI</th><th>Cause</th><th>7-Day</th><th>Source</th><th>Action</th></tr></thead>
      <tbody>
      ${sorted.map(h=>`<tr>
        <td style="font-family:var(--fm);font-size:11px;color:var(--accent)">${h.id}</td>
        <td style="font-weight:600">${h.loc}</td>
        <td style="font-family:var(--fm);font-size:10px;color:var(--text3)">${h.lat}<br>${h.lng}</td>
        <td style="font-family:var(--fh);font-size:16px;color:${h.temp>=40?'var(--heat1)':h.temp>=38?'var(--heat2)':'var(--sun)'}">${h.temp.toFixed(1)}</td>
        <td><span class="sev ${h.sev}">${h.sev.toUpperCase()}</span></td>
        <td style="font-family:var(--fm);font-size:11px;color:${h.ndvi<0.1?'var(--heat1)':h.ndvi<0.2?'var(--sun)':'var(--green)'}">${h.ndvi.toFixed(2)}</td>
        <td style="font-size:11px;color:var(--text3);max-width:100px">${h.cause}</td>
        <td><div class="spark">${h.trend.map(v=>`<div class="sp-bar" style="height:${v*3+2}px;background:${v>=5?'var(--heat1)':v>=4?'var(--heat2)':'var(--sun)'}"></div>`).join('')}</div></td>
        <td style="font-family:var(--fm);font-size:10px;color:var(--text3)">${h.sat}</td>
        <td><button class="act-btn" onclick="notify('Loading ${h.id} detail view...','info')">Analyze</button></td>
      </tr>`).join('')}
      </tbody>
    </table>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════
   MITIGATION
══════════════════════════════════════════════ */
function renderMitigation(){
  const sel=[...S.activeIv].map(i=>IVS[i]).filter(Boolean);
  const totalCost=sel.reduce((s,iv)=>s+parseFloat(iv.cost.replace('₱','').replace('M','')),0);
  const totalImpact=sel.reduce((s,iv)=>s+iv.impact,0);
  return `
  <div class="g4">
    <div class="sm s2"><div class="sm-label">Active Interventions</div><div class="sm-val">${S.activeIv.size} <span>of ${IVS.length}</span></div></div>
    <div class="sm s1"><div class="sm-label">Total Budget</div><div class="sm-val">₱${totalCost.toFixed(1)} <span>M</span></div><div class="sm-delta up">LGU + DENR co-fund</div></div>
    <div class="sm s3"><div class="sm-label">Projected Cooling</div><div class="sm-val" style="color:var(--green)">−${totalImpact.toFixed(1)} <span>°C</span></div><div class="sm-delta dn">Combined estimate</div></div>
    <div class="sm s4"><div class="sm-label">Scenario</div><div class="sm-val" style="font-size:15px">${S.mitScen.toUpperCase()}</div></div>
  </div>
  <div class="g21">

function renderCompare(){

  </div>

    <div class="card-hd"><div class="card-title"><span class="dot" style="background:var(--accent)"></span>City Selection (max 6)</div><div class="badge">${selArr.length} SELECTED</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${allCities.map(c=>`<div class="ct-tab${S.selCities.has(c)?' active':''}" data-city="${c}">${c}</div>`).join('')}
    </div>
  </div>
  <div class="card mb">
    <div class="card-hd"><div class="card-title"><span class="dot" style="background:var(--heat1)"></span>Comparative Metrics Matrix</div><div class="badge">LIVE DATA · 2025</div></div>
    <div style="overflow-x:auto">
      <div style="display:grid;grid-template-columns:170px repeat(${selArr.length},1fr);gap:0;min-width:500px">
        <div style="padding:9px 12px;background:var(--bg3);font-family:var(--fm);font-size:10px;color:var(--text3);border:1px solid var(--border);border-right:none;border-bottom:none">METRIC</div>
        ${selArr.map((c,ci)=>`<div style="padding:9px 12px;background:var(--bg3);font-family:var(--fh);font-size:12px;color:var(--accent);border:1px solid var(--border);${ci<selArr.length-1?'border-right:none':''}border-bottom:none">${c}</div>`).join('')}
        ${metrics.map((m,mi)=>`
          <div style="padding:9px 12px;font-family:var(--fm);font-size:10px;color:var(--text3);border:1px solid var(--border);border-right:none;${mi<metrics.length-1?'border-bottom:none':''}">${m.label} (${m.unit})</div>
          ${selArr.map((c,ci)=>{
            const v=CITIES_DATA[c]?.[m.key]??0;
            const pct=Math.min(100,Math.round((v/m.max)*100));
            const vals=selArr.map(x=>CITIES_DATA[x]?.[m.key]??0);
            const isBest=m.higher==='worse'?v===Math.min(...vals):m.higher==='better'?v===Math.max(...vals):false;

  </div>

    </div>
  </div>`;
}

/* ══════════════════════════════════════════════

══════════════════════════════════════════════ */
function bindSectionEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>{S.nav=el.dataset.nav;reloadSection();}));
  document.querySelectorAll('[data-layer]').forEach(el=>el.addEventListener('click',()=>{S.heatLayer=el.dataset.layer;S.satLayer=el.dataset.layer;reloadSection();}));
  const hsSearch=document.getElementById('hs-search');
  if(hsSearch)hsSearch.addEventListener('input',e=>{S.hsFilter=e.target.value.toLowerCase();reloadSection();});
  document.querySelectorAll('[data-sort]').forEach(el=>el.addEventListener('click',()=>{if(S.hsSort===el.dataset.sort)S.hsSortDir*=-1;else{S.hsSort=el.dataset.sort;S.hsSortDir=-1;}reloadSection();}));
  document.querySelectorAll('[data-district]').forEach(el=>el.addEventListener('click',()=>{S.selDistrict=parseInt(el.dataset.district);reloadSection();}));
  document.querySelectorAll('[data-scenario]').forEach(el=>el.addEventListener('click',()=>{S.mitScen=el.dataset.scenario;reloadSection();}));
  document.querySelectorAll('[data-iv]').forEach(el=>el.addEventListener('click',()=>{const i=parseInt(el.dataset.iv);if(S.activeIv.has(i))S.activeIv.delete(i);else S.activeIv.add(i);reloadSection();}));
  document.querySelectorAll('[data-date]').forEach(el=>el.addEventListener('click',()=>{S.satDate=parseInt(el.dataset.date);reloadSection();}));
  document.querySelectorAll('[data-city]').forEach(el=>el.addEventListener('click',()=>{
    const c=el.dataset.city;
    if(S.selCities.has(c)){if(S.selCities.size>1)S.selCities.delete(c);}
    else if(S.selCities.size<6)S.selCities.add(c);
    reloadSection();
  }));
  const tr=document.getElementById('tree-range');
  if(tr)tr.addEventListener('input',e=>{S.treeCount=parseInt(e.target.value);const el=document.getElementById('tree-val');if(el)el.textContent=S.treeCount.toLocaleString();});
  const pr=document.getElementById('pave-range');
  if(pr)pr.addEventListener('input',e=>{S.pavingKm=parseInt(e.target.value);const el=document.getElementById('pave-val');if(el)el.textContent=e.target.value;});
  const rr=document.getElementById('roof-range');
  if(rr)rr.addEventListener('input',e=>{S.roofCount=parseInt(e.target.value);const el=document.getElementById('roof-val');if(el)el.textContent=e.target.value;});
  const tt=document.getElementById('thresh-temp');
  if(tt)tt.addEventListener('input',e=>{const el=document.getElementById('thresh-val');if(el)el.textContent=parseFloat(e.target.value).toFixed(1)+'°C';});
  const tn=document.getElementById('thresh-ndvi');
  if(tn)tn.addEventListener('input',e=>{const el=document.getElementById('ndvi-val');if(el)el.textContent=parseFloat(e.target.value).toFixed(2);});
  const trs=document.getElementById('thresh-rise');
  if(trs)trs.addEventListener('input',e=>{const el=document.getElementById('rise-val');if(el)el.textContent=parseFloat(e.target.value).toFixed(1);});
  // AI Chat
  const aiSend=document.getElementById('ai-send');
  const aiInput=document.getElementById('ai-input');
  if(aiSend)aiSend.addEventListener('click',sendAI);
  if(aiInput)aiInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendAI();});
  document.querySelectorAll('[data-quick]').forEach(el=>el.addEventListener('click',()=>{
    const inp=document.getElementById('ai-input');
    if(inp){inp.value=el.dataset.quick;sendAI();}
  }));
  // AI countdown
  if(S.nav==='ai'){
    let cd=298;
    const cdInterval=setInterval(()=>{
      const el=document.getElementById('countdown');
      if(!el){clearInterval(cdInterval);return;}
      cd--;if(cd<0)cd=299;
      const m=String(Math.floor(cd/60)).padStart(2,'0');
      const s=String(cd%60).padStart(2,'0');
      el.textContent=`${m}:${s}`;
    },1000);
  }
}

function sendAI(){
  const inp=document.getElementById('ai-input');
  if(!inp||!inp.value.trim())return;
  const q=inp.value.trim();
  inp.value='';
  S.aiChat.push({role:'user',content:q});
  S.aiTyping=true;
  const log=document.getElementById('chat-log');
  if(log){
    log.innerHTML+=`<div class="chat-msg user"><div class="chat-label u">YOU</div>${q}</div>`;
    log.innerHTML+=`<div class="chat-msg ai" id="typing-msg"><div class="chat-label a">INIT.GPT-THERMAL</div><span style="color:var(--text3);font-family:var(--fm);font-size:11px">Analyzing thermal data</span><span class="ai-cursor"></span></div>`;
    log.scrollTop=log.scrollHeight;
  }
  const qLower=q.toLowerCase();
  const match=AI_RESPONSES.find(r=>r.trigger.some(t=>qLower.includes(t)))||{response:DEFAULT_AI};
  setTimeout(()=>{
    S.aiTyping=false;
    S.aiChat.push({role:'ai',content:match.response});
    const typing=document.getElementById('typing-msg');
    if(typing)typing.remove();
    if(log){
      log.innerHTML+=`<div class="chat-msg ai"><div class="chat-label a">INIT.GPT-THERMAL</div><span style="font-family:var(--fm);font-size:11px;line-height:1.7">${match.response}</span></div>`;
      log.scrollTop=log.scrollHeight;
    }
  },1800);
}

  <div class="g3">

    <div>
      <div class="card mb">
        <div class="card-hd"><div class="card-title"><span class="dot" style="background:var(--sun)"></span>Frequently Asked Questions</div></div>
        ${faqs.map((f,i)=>`<div style="border-bottom:1px solid var(--border);padding:10px 0">
          <div style="font-size:12.5px;font-weight:600;margin-bottom:5px;cursor:pointer;color:var(--text)" onclick="const a=document.getElementById('faq-a-${i}');a.style.display=a.style.display==='none'?'block':'none'">${f.q}</div>
          <div id="faq-a-${i}" style="font-size:11px;color:var(--text3);line-height:1.6;display:${i<2?'block':'none'}">${f.a}</div>

      </div>
      <div class="card mb">
        <div class="card-hd"><div class="card-title"><span class="dot" style="background:var(--blue)"></span>Quick Reference</div></div>
        ${[['NDVI < 0','Water / Bare surface'],['0.0 – 0.1','Sparse vegetation'],['0.1 – 0.2','Low vegetation'],['0.2 – 0.4','Moderate canopy'],['> 0.4','Dense forest'],['UHI > 4°C','Critical heat island'],['LST > 40°C','Emergency threshold'],['Cloud > 20%','Data quality degraded']].map(([k,v])=>`<div class="roi-row"><div class="roi-label" style="font-family:var(--fm);font-size:11px;color:var(--accent)">${k}</div><div class="roi-val" style="font-size:11px">${v}</div></div>`).join('')}
      </div>
      <div class="card">
        <div class="card-hd"><div class="card-title"><span class="dot" style="background:var(--green)"></span>Contact Support</div></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <textarea class="filter-input" style="resize:vertical;min-height:80px;padding:10px 12px;font-size:12px" placeholder="Describe your issue or question..."></textarea>
          <button class="auth-btn" style="font-size:13px;padding:10px" onclick="notify('Support ticket submitted. We will respond within 24 hours.','success')">Send Support Request →</button>
          <div style="text-align:center;font-size:11px;font-family:var(--fm);color:var(--text3)">or email <span style="color:var(--accent)">lgu@init.ai</span> · Tel: (02) 8525-INIT</div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════
   EXTRA CHART HANDLERS
══════════════════════════════════════════════ */
function chartsBarangay(){
  const b=BARANGAYS[S.selBarangay||0];
  makeChart('bgryChart',{type:'radar',data:{
    labels:['Heat Risk','Impervious','Tree Cover','Population','NDVI','Temp Index'],
    datasets:[{label:b.name,data:[
      b.risk==='critical'?95:b.risk==='high'?70:b.risk==='moderate'?45:20,
      b.impervious,
      Math.max(0,100-b.impervious),
      Math.min(100,b.pop/500),
      Math.max(0,(0.6-b.ndvi)/0.6*100),
      Math.min(100,(b.temp-20)/25*100),
    ],backgroundColor:'rgba(255,107,43,.1)',borderColor:'#ff6b2b',borderWidth:1.5,pointBackgroundColor:'#ff6b2b',pointRadius:3}]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{r:{grid:{color:C.grid},ticks:{color:C.tick,font:{family:C.font,size:7},backdropColor:'transparent',stepSize:25},pointLabels:{color:C.tick,font:{family:C.font,size:8}},min:0,max:100}}}});
  makeChart('bgryTempChart',{type:'bar',data:{
    labels:BARANGAYS.map(b=>b.name.split(' ')[0]),
    datasets:[{label:'LST',data:BARANGAYS.map(b=>b.temp),backgroundColor:BARANGAYS.map(b=>b.temp>=40?'#ff2000':b.temp>=38?'#ff6b2b':b.temp>=36?'#ffb347':'#4ade80'),borderRadius:3}]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:C.grid},ticks:{color:C.tick,font:{family:C.font,size:8},maxRotation:30}},y:{grid:{color:C.grid},ticks:{color:C.tick,font:{family:C.font,size:8},callback:v=>v+'°C'},min:22,max:44}}}});
}

  const horizons={

    '14d':{labels:Array.from({length:14},(_,i)=>`D${i+1}`),temps:[38.4,38.7,39.0,39.4,39.9,40.4,41.2,40.8,40.2,39.8,39.3,38.9,38.5,38.2],min:[36,36.2,36.5,36.8,37.2,37.8,38.9,38.5,38.0,37.5,37.0,36.6,36.2,36.0],max:[40.8,41.1,41.5,42.0,42.5,43.0,43.5,43.2,42.5,42.0,41.5,41.0,40.6,40.3]},
    '30d':{labels:Array.from({length:10},(_,i)=>`W${i+1}`),temps:[38.4,38.8,39.3,39.9,40.5,41.1,40.7,40.2,39.8,39.4],min:[36,36.4,36.9,37.4,38.0,38.7,38.2,37.8,37.3,36.9],max:[40.8,41.2,41.7,42.3,43.0,43.5,43.2,42.6,42.1,41.7]},
    '90d':{labels:['Jun','Jul','Aug','Sep'],temps:[38.4,41.2,40.1,37.8],min:[35.5,38.5,37.2,34.8],max:[41.2,43.5,43.0,40.5]},
  };
  const fh=S.forecastHorizon||'7d';
  const fd2=horizons[fh];
  makeChart('forecastChart',{type:'line',data:{
    labels:fd2.labels,
    datasets:[
      {label:'Max',data:fd2.max,borderColor:'rgba(255,58,26,.2)',backgroundColor:'rgba(255,107,43,.1)',borderWidth:1,fill:'+1',tension:.4,pointRadius:0},
      {label:'Predicted',data:fd2.temps,borderColor:'#ff3a1a',borderWidth:2.5,pointRadius:4,pointBackgroundColor:'#ff3a1a',tension:.4,fill:false},
      {label:'Min',data:fd2.min,borderColor:'rgba(255,58,26,.2)',borderWidth:1,fill:false,tension:.4,pointRadius:0},
    ]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:C.grid},ticks:{color:C.tick,font:{family:C.font,size:9}}},y:{grid:{color:C.grid},ticks:{color:C.tick,font:{family:C.font,size:9},callback:v=>v+'°C'},min:30,max:46}}}});
  makeChart('interventionForecastChart',{type:'line',data:{
    labels:fd2.labels,
    datasets:[
      {label:'BAU',data:fd2.temps.map(v=>v+0.8),borderColor:'#ff3a1a',borderWidth:2,tension:.4,pointRadius:3,borderDash:[4,3]},
      {label:'With interventions',data:fd2.temps.map(v=>v-2.1),borderColor:'#4ade80',borderWidth:2,tension:.4,pointRadius:3},
    ]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:C.grid},ticks:{color:C.tick,font:{family:C.font,size:8},maxTicksLimit:6}},y:{grid:{color:C.grid},ticks:{color:C.tick,font:{family:C.font,size:8},callback:v=>v+'°C'},min:32,max:46}}}});
}

function chartsTracker(){
  const sc={};
  ACTIONS.forEach(a=>{sc[a.status]=(sc[a.status]||0)+1;});
  makeChart('trackerStatusChart',{type:'doughnut',data:{
    labels:Object.keys(sc),
    datasets:[{data:Object.values(sc),backgroundColor:['#4fa3e0','#ffd166','#c084fc','#4ade80'],borderColor:'#0f0705',borderWidth:3}]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'60%'}});
  makeChart('trackerBudgetChart',{type:'bar',data:{
    labels:ACTIONS.map(a=>a.id),
    datasets:[
      {label:'Budget',data:ACTIONS.map(a=>parseFloat(a.budget.replace('₱','').replace('M',''))),backgroundColor:'rgba(255,107,43,.3)',borderRadius:3},
      {label:'Spent',data:ACTIONS.map(a=>parseFloat(a.spent.replace('₱','').replace('M','')||0)),backgroundColor:'#ff6b2b',borderRadius:3},
    ]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:C.grid},ticks:{color:C.tick,font:{family:C.font,size:9}}},y:{grid:{color:C.grid},ticks:{color:C.tick,font:{family:C.font,size:9},callback:v=>'₱'+v+'M'}}}}});
}

function chartsSurvey(){
  const satTemps=SURVEY_ENTRIES.map(s=>s.temp+Math.random()*0.8-0.4);
  const fieldTemps=SURVEY_ENTRIES.map(s=>s.temp);
  makeChart('surveyAccuracyChart',{type:'scatter',data:{
    datasets:[{label:'Ground Truth',data:SURVEY_ENTRIES.map((s,i)=>({x:satTemps[i],y:fieldTemps[i]})),backgroundColor:'#ff6b2b',pointRadius:7}]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:C.grid},ticks:{color:C.tick,font:{family:C.font,size:8}},title:{display:true,text:'Satellite LST (°C)',color:C.tick,font:{size:8,family:C.font}}},y:{grid:{color:C.grid},ticks:{color:C.tick,font:{family:C.font,size:8}},title:{display:true,text:'Field Temp (°C)',color:C.tick,font:{size:8,family:C.font}}}}}});
}

function chartsNotifications(){
  makeChart('notifVolumeChart',{type:'bar',data:{
    labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
    datasets:[
      {label:'Emergency',data:[1,2,1,2,0,0,1],backgroundColor:'#ff2000',borderRadius:3},
      {label:'Alert',data:[2,1,2,1,1,0,1],backgroundColor:'#ff8c00',borderRadius:3},
      {label:'Info',data:[3,2,4,3,2,1,3],backgroundColor:'#4fa3e0',borderRadius:3},
    ]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:C.grid},ticks:{color:C.tick,font:{family:C.font,size:9}},stacked:true},y:{grid:{color:C.grid},ticks:{color:C.tick,font:{family:C.font,size:9}},stacked:true}}}});

/* ══════════════════════════════════════════════
   PATCH renderCharts TO HANDLE NEW MODULES
══════════════════════════════════════════════ */
const _origRenderCharts=renderCharts;
function renderCharts(){
  setTimeout(()=>{
    const nav=S.nav;
    if(nav==='dashboard') chartsDashboard();
    else if(nav==='heatmap') chartsHeatmap();
    else if(nav==='hotspots') chartsHotspots();
    else if(nav==='canopy') chartsCanopy();
    else if(nav==='mitigation') chartsMitigation();
    else if(nav==='barangay') chartsBarangay();
    else if(nav==='forecast') chartsForecast();
    else if(nav==='tracker') chartsTracker();
    else if(nav==='survey') chartsSurvey();
    else if(nav==='reports') chartsReports();
    else if(nav==='alerts') chartsAlerts();
    else if(nav==='notifications') chartsNotifications();
    else if(nav==='ai') chartsAI();
    else if(nav==='satellite') chartsSatellite();
    else if(nav==='compare') chartsCompare();
    else if(nav==='export') chartsExport();
    else if(nav==='users') chartsUsers();
  },90);
}

/* ══════════════════════════════════════════════
   PATCH bindSectionEvents FOR NEW MODULES
══════════════════════════════════════════════ */
const _origBind=bindSectionEvents;
function bindSectionEvents(){
  _origBind();
  document.querySelectorAll('[data-bgry]').forEach(el=>el.addEventListener('click',()=>{S.selBarangay=parseInt(el.dataset.bgry);reloadSection();}));
  document.querySelectorAll('[data-fh]').forEach(el=>el.addEventListener('click',()=>{S.forecastHorizon=el.dataset.fh;reloadSection();}));
  document.querySelectorAll('[data-tf]').forEach(el=>el.addEventListener('click',()=>{S.trackerFilter=el.dataset.tf;reloadSection();}));
  document.querySelectorAll('[data-nf]').forEach(el=>el.addEventListener('click',()=>{S.notifFilter=el.dataset.nf;reloadSection();}));
}

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
render();
</script>

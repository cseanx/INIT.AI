<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INIT.AI | Urban Intelligence Platform</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

     <link rel="icon" href="public/assets/images/favicon.svg" type="image/svg+xml">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Open Graph preview -->
    <meta property="og:title" content="INIT.AI"/>
    <meta property="og:description" content="AI-powered Urban Heat Mapping & Mitigation Platform for Philippine Cities."/>
    <meta property="og:image" content="https://cseanx.github.io/INIT.AI/assets/images/preview_image.png"/>
    <meta property="og:url" content="https://cseanx.github.io/INIT.AI/"/>
    <meta property="og:type" content="website"/>
    <!-- Apply the saved theme + accent before the app mounts to avoid a flash. -->
    <script>
        (function () {
            var prefs = null;
            try {
                prefs = JSON.parse(localStorage.getItem('initai_preferences') || 'null');
            } catch (e) { /* corrupted storage — fall back to defaults */ }

            var theme = prefs && prefs.theme === 'light' ? 'light'
                : prefs && prefs.theme === 'dark' ? 'dark'
                : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;

            var accents = {
                sunset: ['#ff2d55', '#ff5577', '#ff8c42', '255, 45, 85'],
                ocean: ['#5aa9ff', '#2f6f9e', '#8ec7ff', '90, 169, 255'],
                canopy: ['#ff2d55', '#ff5577', '#ff8c42', '255, 45, 85'],
                amber: ['#ff2d55', '#ff5577', '#ff8c42', '255, 45, 85'],
                violet: ['#ff2d55', '#ff5577', '#ff8c42', '255, 45, 85']
            };
            var palette = accents[(prefs && prefs.accent) || 'sunset'] || accents.sunset;
            var root = document.documentElement;
            root.style.setProperty('--color-primary', palette[0]);
            root.style.setProperty('--color-accent', palette[1]);
            root.style.setProperty('--color-orange', palette[2]);
            root.style.setProperty('--accent-glow', palette[3]);
            root.dataset.accent = (prefs && prefs.accent) || 'sunset';
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<!---LOGIN !--->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INIT.AI | Login</title>
    <meta property="og:image" content="preview_image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="background">
    <div class="grid"></div>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <div id="particles"></div>
</div>

<main class="login-container">
    <section class="login-card">
        <div class="logo">
            <div class="logo-circle">
                <img src="assets/images/logo.svg" alt="INIT.AI logo">
            </div>
            <div>
                <h1>INIT.AI</h1>
                <p>Urban Intelligence Platform</p>
            </div>
        </div>
        <h2>Welcome Back</h2>
        <span class="subtitle">
            Sign in to continue monitoring urban heat intelligence.
        </span>
        <form>
            <div class="input-group">
                <label>Email Address</label>
                <input
                    type="email"
                    placeholder="admin@init.ai"
                    required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    placeholder="admin123"
                    required>
            </div>
           <button id="loginBtn">
                Login
            </button>
        </form>
        <footer>
            Prototype Version • 2026
        </footer>
    </section>
</main>

<script src="script.js"></script>

</body>
</html>
